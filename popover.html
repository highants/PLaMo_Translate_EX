<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PLaMo 翻訳</title>
  <link rel="stylesheet" href="content.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
    }
    body.is-window-mode {
      background: #ffffff !important;
      color: #1e293b;
    }
    @media (prefers-color-scheme: dark) {
      body.is-window-mode {
        background: #0f172a !important;
        color: #f8fafc;
      }
    }
    .plamo-ext-popover-card {
      position: static !important;
      width: 100% !important;
      max-width: 100% !important;
      box-shadow: none !important;
      animation: none !important;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      height: 100% !important;
      overflow: hidden;
    }
    body.is-window-mode .plamo-ext-popover-card {
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
      border-radius: 0 !important;
      background: transparent !important;
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-popover-card {
        border-color: #334155;
      }
    }
    .plamo-ext-card-body {
      flex: 1 1 auto;
      min-height: 50px;
      max-height: none !important;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .plamo-ext-card-header {
      flex: 0 0 auto;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .plamo-ext-card-header:active {
      cursor: grabbing;
    }
    body.is-window-mode .plamo-ext-card-header {
      cursor: default;
    }
    .plamo-ext-header-controls select,
    .plamo-ext-header-controls button {
      cursor: pointer;
    }
    .plamo-ext-card-footer {
      flex: 0 0 auto;
      position: relative;
      padding-right: 20px;
    }
    .plamo-ext-resize-handle {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: nwse-resize;
      color: #94a3b8;
      user-select: none;
      touch-action: none;
      z-index: 20;
      opacity: 0.6;
      transition: opacity 0.15s, color 0.15s;
    }
    .plamo-ext-resize-handle:hover {
      opacity: 1;
      color: #3b82f6;
    }
    body.is-window-mode .plamo-ext-resize-handle {
      display: none; /* OS window frame handles resizing in native window mode */
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-resize-handle {
        color: #64748b;
      }
      .plamo-ext-resize-handle:hover {
        color: #60a5fa;
      }
    }
    .plamo-ext-btn-close-window {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      margin-left: 6px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    body.is-window-mode .plamo-ext-btn-close-window {
      display: none; /* OS title bar already provides the window close button */
    }
    .plamo-ext-btn-close-window:hover {
      background: #fee2e2;
      color: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-btn-close-window:hover {
        background: #7f1d1d;
        color: #fca5a5;
      }
    }
  </style>
</head>
<body>
  <div class="plamo-ext-popover-card" id="popoverCard" tabindex="-1">
    <div class="plamo-ext-card-header">
      <div class="plamo-ext-header-brand">
        <span class="plamo-ext-brand-icon">🌐</span>
        <span class="plamo-ext-brand-name">PLaMo</span>
      </div>
      <div class="plamo-ext-header-controls">
        <select class="plamo-ext-select plamo-ext-card-target-lang" id="targetLangSelect" title="翻訳先の言語"></select>
        <select class="plamo-ext-select plamo-ext-card-form" id="formSelect" title="文体 (日本語のみ)" style="display:none;"></select>
        <button class="plamo-ext-btn-close-window" id="btnCloseWindow" title="閉じる (Esc)">✕</button>
      </div>
    </div>
    <div class="plamo-ext-card-body" id="cardBody">
      <div class="plamo-ext-loading">
        <div class="plamo-ext-spinner"></div>
        <span id="loadingSpan">翻訳中...</span>
      </div>
    </div>
    <div class="plamo-ext-card-footer">
      <span class="plamo-ext-card-status" id="cardStatus" style="font-size:11px; color:#64748b;">PLaMo</span>
      <div class="plamo-ext-footer-actions">
        <button class="plamo-ext-btn plamo-ext-card-replace" id="btnReplace" style="display:none;">置換</button>
        <button class="plamo-ext-btn plamo-ext-card-reload" id="btnReload" title="再翻訳">再翻訳</button>
        <button class="plamo-ext-btn plamo-ext-btn-primary plamo-ext-card-copy" id="btnCopy">コピー</button>
      </div>
      <div class="plamo-ext-resize-handle" id="resizeHandle" title="ドラッグしてリサイズ">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M9 2L2 9M9 5L5 9M9 8L8 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="pfml.js"></script>
  <script src="popover.js"></script>
</body>
</html>
