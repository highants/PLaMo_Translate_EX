<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PLaMo 翻訳</title>
  <link rel="stylesheet" href="content.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
    }
    body.is-window-mode {
      background: #ffffff !important;
      color: #1e293b;
    }
    @media (prefers-color-scheme: dark) {
      body.is-window-mode {
        background: #0f172a !important;
        color: #f8fafc;
      }
    }
    .plamo-ext-popover-card {
      position: static !important;
      width: 100% !important;
      max-width: 100% !important;
      box-shadow: none !important;
      animation: none !important;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: background 0.2s ease, border-color 0.2s ease, border-radius 0.2s ease;
    }
    body.is-window-mode .plamo-ext-popover-card {
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
      border-radius: 0 !important;
      background: transparent !important;
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-popover-card {
        border-color: #334155;
      }
    }

    /* Minimal Pill State during Translation in iframe mode */
    body:not(.is-window-mode) .plamo-ext-popover-card.is-translating {
      border-radius: 20px !important;
      background: #ffffff !important;
      padding: 0 !important;
      border: 1px solid #cbd5e1 !important;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12) !important;
    }
    @media (prefers-color-scheme: dark) {
      body:not(.is-window-mode) .plamo-ext-popover-card.is-translating {
        background: #1e293b !important;
        border-color: #475569 !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
      }
    }
    body:not(.is-window-mode) .plamo-ext-popover-card.is-translating .plamo-ext-card-header,
    body:not(.is-window-mode) .plamo-ext-popover-card.is-translating .plamo-ext-card-footer {
      display: none !important;
    }
    body:not(.is-window-mode) .plamo-ext-popover-card.is-translating .plamo-ext-card-body {
      max-height: none !important;
      overflow: hidden !important;
      padding: 6px 12px !important;
    }

    /* Sleek Loading Indicator Bar */
    .plamo-ext-indicator-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      line-height: 1.4;
      user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-indicator-bar {
        color: #f1f5f9;
      }
    }
    .plamo-ext-indicator-bar .plamo-ext-brand-icon {
      font-size: 14px;
      line-height: 1;
    }
    .plamo-ext-indicator-bar .plamo-ext-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: plamo-spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-indicator-bar .plamo-ext-spinner {
        border-color: #334155;
        border-top-color: #60a5fa;
      }
    }
    .plamo-ext-indicator-bar .plamo-ext-loading-text {
      flex: 1 1 auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
    .plamo-ext-btn-cancel-translating {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
      margin-left: 4px;
    }
    .plamo-ext-btn-cancel-translating:hover {
      background: #fee2e2;
      color: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-btn-cancel-translating:hover {
        background: #7f1d1d;
        color: #fca5a5;
      }
    }
    @keyframes plamo-spin {
      to { transform: rotate(360deg); }
    }
    .plamo-ext-card-body {
      max-height: 280px;
      overflow-y: auto;
      flex: 1 1 auto;
    }
    body.is-window-mode .plamo-ext-card-body {
      max-height: none;
    }
    .plamo-ext-card-header {
      flex: 0 0 auto;
    }
    .plamo-ext-card-footer {
      flex: 0 0 auto;
    }
    .plamo-ext-btn-close-window {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      margin-left: 6px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    body.is-window-mode .plamo-ext-btn-close-window {
      display: none; /* OS title bar already provides the window close button */
    }
    .plamo-ext-btn-close-window:hover {
      background: #fee2e2;
      color: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      .plamo-ext-btn-close-window:hover {
        background: #7f1d1d;
        color: #fca5a5;
      }
    }
  </style>
</head>
<body>
  <div class="plamo-ext-popover-card" id="popoverCard" tabindex="-1">
    <div class="plamo-ext-card-header">
      <div class="plamo-ext-header-brand">
        <span class="plamo-ext-brand-icon">🌐</span>
        <span class="plamo-ext-brand-name">PLaMo</span>
      </div>
      <div class="plamo-ext-header-controls">
        <select class="plamo-ext-select plamo-ext-card-target-lang" id="targetLangSelect" title="翻訳先の言語"></select>
        <select class="plamo-ext-select plamo-ext-card-form" id="formSelect" title="文体 (日本語のみ)" style="display:none;"></select>
        <button class="plamo-ext-btn-close-window" id="btnCloseWindow" title="閉じる (Esc)">✕</button>
      </div>
    </div>
    <div class="plamo-ext-card-body" id="cardBody">
      <div class="plamo-ext-loading">
        <div class="plamo-ext-spinner"></div>
        <span id="loadingSpan">翻訳中...</span>
      </div>
    </div>
    <div class="plamo-ext-card-footer">
      <span class="plamo-ext-card-status" id="cardStatus" style="font-size:11px; color:#64748b;">PLaMo</span>
      <div class="plamo-ext-footer-actions">
        <button class="plamo-ext-btn plamo-ext-card-replace" id="btnReplace" style="display:none;">置換</button>
        <button class="plamo-ext-btn plamo-ext-card-reload" id="btnReload" title="再翻訳">再翻訳</button>
        <button class="plamo-ext-btn plamo-ext-btn-primary plamo-ext-card-copy" id="btnCopy">コピー</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="pfml.js"></script>
  <script src="popover.js"></script>
</body>
</html>
